allprojects {
    repositories { google(); mavenCentral() }
}
rootProject.layout.buildDirectory.set(file("../build"))
subprojects { project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name)) }
tasks.register("clean", Delete) { delete rootProject.layout.buildDirectory }

// Global JVM 17 compatibility for Android Java and Kotlin compilation.
subprojects {
    afterEvaluate { project ->
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17.toString()
            targetCompatibility = JavaVersion.VERSION_17.toString()
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }
}
