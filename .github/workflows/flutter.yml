name: Flutter Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository archive is missing gradle-wrapper.jar. Provision Gradle
      # directly, then regenerate the wrapper from the configured distribution.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain and repair Gradle wrapper
        run: |
          java -version
          gradle --version
          flutter --version
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
          # Generate the wrapper jar in an empty directory so the Flutter Gradle
          # plugin check never runs against an incompatible Gradle.
          tmp="$(mktemp -d)"
          (cd "$tmp" && gradle wrapper --gradle-version 9.3.1 --distribution-type bin)
          mkdir -p android/gradle/wrapper
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Resolve API URL
        run: echo "API_URL=${API_URL:-https://cstatwt-aljtaztair.onrender.com}" >> "$GITHUB_ENV"
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Build release APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release --dart-define=API_URL="$API_URL" && exit 0
            echo "Build attempt $i failed (possibly Maven 429); retrying in 60s"; sleep 60
          done
          exit 1

      - name: Build release App Bundle
        run: |
          for i in 1 2 3; do
            flutter build appbundle --release --dart-define=API_URL="$API_URL" && exit 0
            echo "Build attempt $i failed (possibly Maven 429); retrying in 60s"; sleep 60
          done
          exit 1

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sawt-aljazair-v2.0.0-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
