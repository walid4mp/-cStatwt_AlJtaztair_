
name: Flutter Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawt-aljazair-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sawt Al Jazair Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle compatible with current AGP/Kotlin
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      # 4. Pin Flutter to avoid automatic major toolchain changes
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # 5. Verify Android toolchain and generate wrapper
      - name: Verify and prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          flutter --version
          flutter doctor -v || true

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          printf 'flutter.sdk=%s\nsdk.dir=%s\n' \
            "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties

          cd android

          gradle wrapper \
            --gradle-version 8.14.3 \
            --distribution-type bin

          chmod +x gradlew

          test -s gradle/wrapper/gradle-wrapper.jar

          ./gradlew --version

          cd ..

      # 6. Cache Flutter packages
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 7. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 8. Validate Dart code
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      # 9. Configure API URL
      - name: Resolve API URL
        shell: bash
        env:
          API_URL_SECRET: ${{ secrets.API_URL }}
        run: |
          API_URL="${API_URL_SECRET:-https://cstatwt-aljtaztair.onrender.com}"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      # 10. Build APK
      - name: Build release APK
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if flutter build apk --release \
              --dart-define=API_URL="$API_URL"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "APK build failed after 3 attempts."
              exit 1
            fi

            echo "APK build failed. Retrying in 60 seconds..."
            sleep 60
          done

          test -s build/app/outputs/flutter-apk/app-release.apk

      # 11. Build Google Play App Bundle
      - name: Build release App Bundle
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if flutter build appbundle --release \
              --dart-define=API_URL="$API_URL"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "App Bundle build failed after 3 attempts."
              exit 1
            fi

            echo "App Bundle build failed. Retrying in 60 seconds..."
            sleep 60
          done

          test -s build/app/outputs/bundle/release/app-release.aab

      # 12. Upload APK and AAB
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sawt-aljazair-v2.0.0-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
