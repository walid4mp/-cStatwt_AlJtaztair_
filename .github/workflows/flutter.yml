name: Flutter Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository archive is missing gradle-wrapper.jar. Provision Gradle
      # directly, then regenerate the wrapper from the configured distribution.
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain and repair Gradle wrapper
        run: |
          java -version
          gradle --version
          flutter --version
          flutter doctor -v || true
          mkdir -p android
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type bin
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          bash ./gradlew --version
          cd ..

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Resolve API URL
        run: echo "API_URL=${API_URL:-https://cstatwt-aljtaztair.onrender.com}" >> "$GITHUB_ENV"
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL="$API_URL"

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=API_URL="$API_URL"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sawt-aljazair-v2.0.0-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
