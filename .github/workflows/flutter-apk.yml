name: Build TikBoost APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://tikboost-api-v2.onrender.com/api --dart-define=SOCKET_URL=https://tikboost-api-v2.onrender.com --dart-define=ENABLE_GOOGLE_LOGIN=false --dart-define=ALLOW_LEGACY_PASSWORD_RESET=false

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tikboost-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
